version: '3.8'

services:
  db:
    image: postgres:15
    container_name: portguard_db
    environment:
      POSTGRES_USER: portguard_user
      POSTGRES_PASSWORD: portguard_password
      POSTGRES_DB: portguard_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - portguard-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portguard_backend
    environment:
      - DATABASE_URL=postgresql://portguard_user:portguard_password@db:5432/portguard_ai?schema=public
      - JWT_SECRET=portguard_super_secret_key
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - portguard-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portguard_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - portguard-network
    restart: unless-stopped

  network-engine:
    build:
      context: ./network-engine
      dockerfile: Dockerfile
    container_name: portguard_network_engine
    environment:
      - BACKEND_API_URL=http://backend:5000/api
    depends_on:
      - backend
    networks:
      - portguard-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  portguard-network:
    driver: bridge
